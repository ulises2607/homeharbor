name: Homeharbor CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: homeharbor
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: homeharbor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U homeharbor"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://homeharbor:ci-only-password@localhost:5432/homeharbor_test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          ruby-version: '4.0.9'
          bundler: '4.0.20'
          bundler-cache: true
      - run: ruby bin/rails db:prepare
      - run: ruby bin/rails zeitwerk:check
      - run: ruby bin/rails test
      - run: bundle exec bundler-audit check --update
      - run: SECRET_KEY_BASE_DUMMY=1 RAILS_ENV=production ruby bin/rails assets:precompile
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
