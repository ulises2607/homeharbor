name: homeharbor
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: homeharbor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
      POSTGRES_DB: homeharbor_development
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeharbor -d homeharbor_development"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
