name: homeharbor
x-app: &app
  image: homeharbor:local
  build:
    context: ..
  env_file: .env
  environment:
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: "true"
  restart: unless-stopped

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: homeharbor_production
      POSTGRES_USER: homeharbor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeharbor -d homeharbor_production"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    restart: "no"
    command: ["ruby", "bin/rails", "db:prepare"]
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    volumes:
      - photos:/rails/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
  notifications:
    <<: *app
    command: ["ruby", "bin/rails", "notifications:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  proxy:
    image: caddy:2@sha256:9c1b76fb701c1f77383d3124d9f626e38bcf83bc1255ed47475d4f2420701d03
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  photos:
  caddy_data:
  caddy_config:
