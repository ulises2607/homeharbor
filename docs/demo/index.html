const scenes=[{"file":"01-catalog-desktop.jpg","es":["Un producto de reservas completo","Explorar botes por puerto y capacidad. React + Rails + PostgreSQL."],"en":["A complete booking workflow","Browse boats by port and capacity. React + Rails + PostgreSQL."]},{"file":"02-quote-desktop.jpg","es":["Disponibilidad y precio claros","Dos días, cuatro pasajeros, USD 240. El total se calcula en el servidor."],"en":["Clear availability and pricing","Two days, four guests, USD 240. Pricing is calculated on the server."]},{"file":"03-confirmed-desktop.jpg","es":["Confirmación con reglas consistentes","Precio acordado, fechas en UTC−3 y prevención de reservas superpuestas."],"en":["Booking with consistent rules","Agreed pricing, dates in UTC−3 and database-enforced overlap prevention."]},{"file":"04-owner-desktop.jpg","es":["Un panel para el propietario","Publicaciones e historial propios. Los permisos se validan en la API."],"en":["An owner's view","Own listings and booking history. Permissions are enforced by the API."]},{"file":"05-cancelled-desktop.jpg","es":["Cancelar sin perder el historial","Hasta 24 horas antes. Las fechas vuelven a quedar disponibles."],"en":["Cancellation without losing history","Up to 24 hours before the start. Availability is released."]},{"file":"08-cancellation-email.jpg","es":["Avisos que toleran fallos","Intenciones guardadas en PostgreSQL y reintentos separados de la reserva."],"en":["Notifications that tolerate failures","PostgreSQL stores delivery intent. Email retries do not undo a booking."]},{"file":"06-catalog-mobile.jpg","second":"07-availability-mobile.jpg","es":["También en móvil","Recorrido probado con dos cuentas, 53 pruebas Rails y 23 pruebas React."],"en":["Built for mobile too","Two-account browser walkthrough, 53 Rails tests and 23 React tests."]}];
const copy={
es:{eyebrow:"Caso de estudio · Desarrollo full stack",headline:"De proyecto académico a experiencia de reserva.",lead:"Un flujo completo para explorar, reservar y administrar botes por días. Evolución de Reserve Boats, el proyecto grupal de Microverse.",evidence:"Capturas auténticas de la aplicación local · Datos ficticios · Noviembre 2026",problemTitle:"El desafío",problem:"Conectar una interfaz con reglas de negocio reales: identidad, propiedad de publicaciones, fechas, precios y reservas simultáneas. Una pantalla de éxito solo tiene valor cuando la operación se guardó correctamente.",proofTitle:"La evidencia",proof:"53 pruebas Rails y 23 React, recorridos de cliente y propietario, cotización y cancelación verificadas en móvil, imagen Docker probada y una restauración de base y archivos en un entorno separado.",scopeTitle:"Alcance transparente",scope:"Demo de portfolio sin pagos. El correo fue verificado con transporte local; hosting público, HTTPS con dominio y SMTP real están pendientes. No se atribuyen resultados comerciales ni certificaciones de accesibilidad.",credits:"Evolución mantenida por Ulises Cappa con desarrollo asistido por IA y verificación práctica. Se conserva la autoría del trabajo grupal original."},

let language='es',active=0;
function render(){document.documentElement.lang=language;for(const [key,value] of Object.entries(copy[language]))document.getElementById(key).textContent=value;for(const lang of ['es','en'])document.getElementById(lang).setAttribute('aria-pressed',String(lang===language));const scene=scenes[active];document.getElementById('sceneTitle').textContent=scene[language][0];document.getElementById('caption').textContent=scene[language][1];const figure=document.getElementById('screen');figure.replaceChildren();figure.className=scene.second?'pair':'';for(const file of [scene.file,scene.second].filter(Boolean)){const img=document.createElement('img');img.src='screenshots/'+file;img.alt=scene[language][0];figure.append(img)}const controls=document.getElementById('controls');controls.replaceChildren();scenes.forEach((item,index)=>{const button=document.createElement('button');button.textContent=String(index+1);button.setAttribute('aria-label',item[language][0]);button.setAttribute('aria-pressed',String(index===active));button.onclick=()=>{active=index;render();document.getElementById('controls').children[index].focus()};controls.append(button)})}
for(const lang of ['es','en'])document.getElementById(lang).onclick=()=>{language=lang;render()};
render();
